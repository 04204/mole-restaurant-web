<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="dark">
  <title>摩摩餐廳 · 開發審查版</title>
  <style>
    :root{color-scheme:dark;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:#24160f;color:#ffe9b8}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 15%,#59351c,#21130d 65%)}
    body{display:grid;grid-template-rows:38px minmax(0,1fr)}
    #release-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:7px 16px;background:#140c08;border-bottom:1px solid #8d552b;font-size:14px;letter-spacing:.04em}
    #release-badge{padding:2px 9px;border-radius:999px;background:#8e4b20;color:#fff4d4;font-weight:700}.production #release-badge{background:#2e7047}
    #unity-area{min-height:0;display:grid;place-items:center;padding:8px}
    #unity-shell{position:relative;width:min(100%,calc((100vh - 54px)*16/9));max-height:100%;aspect-ratio:16/9;background:#120b08;box-shadow:0 8px 34px #000a}
    #unity-canvas{display:block;width:100%;height:100%;background:#24160f;outline:none}
    #loading{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:#20130ef2;z-index:2}
    #loading[hidden]{display:none}#progress-track{width:min(360px,70vw);height:12px;border:1px solid #a96b35;border-radius:10px;overflow:hidden;background:#0e0906}
    #progress{height:100%;width:0;background:linear-gradient(90deg,#d4772d,#ffd36a);transition:width .15s}
    #unity-warning{position:absolute;z-index:4;left:50%;top:10px;transform:translateX(-50%);width:min(760px,92%)}
    #unity-warning div{padding:10px 14px;margin:4px;border-radius:6px;background:#8d2f25;color:white;box-shadow:0 2px 12px #0008}
    #fullscreen{position:absolute;right:10px;bottom:10px;z-index:3;border:1px solid #b9773e;border-radius:6px;background:#2c190fdd;color:#ffe6b0;padding:7px 10px;cursor:pointer}
    @media (max-width:800px){#release-bar{font-size:12px}#unity-area{padding:0}#unity-shell{width:100%;max-height:100%}}
  </style>
</head>
<body class="development">
  <header id="release-bar"><span id="release-badge">開發審查版</span><span>UGS development</span><span>milestone-9i-development-20260917-163338Z</span></header>
  <main id="unity-area">
    <section id="unity-shell">
      <canvas id="unity-canvas" width="960" height="600" tabindex="0" aria-label="摩摩餐廳遊戲"></canvas>
      <div id="loading"><strong>摩摩餐廳載入中…</strong><div id="progress-track"><div id="progress"></div></div></div>
      <div id="unity-warning" aria-live="polite"></div>
      <button id="fullscreen" type="button">全螢幕</button>
    </section>
  </main>
  <script>
    const canvas=document.querySelector("#unity-canvas"),loading=document.querySelector("#loading"),progress=document.querySelector("#progress");
    document.documentElement.dataset.moleDevelopmentReview="true";window.__moleBuild={environment:"development",version:"milestone-9i-development-20260917-163338Z"};window.__moleErrors=[];
    function unityShowBanner(message,type){const host=document.querySelector("#unity-warning"),item=document.createElement("div");item.textContent=message;host.appendChild(item);if(type!=="error")setTimeout(()=>item.remove(),5000);if(type==="error")window.__moleErrors.push(String(message));}
    const buildUrl="Build",config={
      dataUrl:buildUrl+"/1c781b96241d4333783831a31559d1a0.data.unityweb?review=milestone-9i-development-20260917-163338Z-pages-development",frameworkUrl:buildUrl+"/5310a78abc5c01bca524472dd85e8266.framework.js.unityweb?review=milestone-9i-development-20260917-163338Z-pages-development",codeUrl:buildUrl+"/e7ab8ae0dcdeacaa167e8bc503ccba30.wasm.unityweb?review=milestone-9i-development-20260917-163338Z-pages-development",
      streamingAssetsUrl:"StreamingAssets",companyName:"DefaultCompany",productName:"MoleRestaurant",
      productVersion:"1.0",showBanner:unityShowBanner,matchWebGLToCanvasSize:true
    };
    const loader=document.createElement("script");loader.src=buildUrl+"/0fdaa43efcacb43c94b85a91455542ea.loader.js?review=milestone-9i-development-20260917-163338Z-pages-development";
    loader.onload=()=>createUnityInstance(canvas,config,value=>progress.style.width=`${Math.round(value*100)}%`).then(instance=>{
      window.__moleUnity=instance;window.__moleUnityReady=true;document.documentElement.dataset.moleReadyMs=performance.now().toFixed(1);document.documentElement.dataset.moleUnityMetrics=JSON.stringify(instance.GetMetricsInfo());loading.hidden=true;canvas.focus();
      document.querySelector("#fullscreen").onclick=()=>instance.SetFullscreen(1);
      instance.SendMessage("GameSession","BrowserVisibilityChanged",document.visibilityState);
    }).catch(error=>{window.__moleErrors.push(String(error));unityShowBanner(error,"error");});
    loader.onerror=()=>unityShowBanner("無法載入遊戲啟動程式。請重新整理或稍後再試。","error");document.body.appendChild(loader);
    document.addEventListener("visibilitychange",()=>window.__moleUnity?.SendMessage("GameSession","BrowserVisibilityChanged",document.visibilityState));
  </script>
</body>
</html>
